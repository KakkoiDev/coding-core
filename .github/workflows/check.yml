name: Check
on: [push, pull_request]
jobs:
  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run format:check
      - run: ruff check python tests tools
      - run: ruff format --check python tests tools
      - name: E2E scenarios and flaky lint (test-core protocol)
        run: python3 -B tools/e2e.py
      - run: python3 -B tools/check.py
